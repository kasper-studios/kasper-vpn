[package]
name = "kasper-vpn-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[lib]
name = "kasper_vpn_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "time", "sync", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks", "cookies"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
aes = "0.9"
ctr = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinInet", "Win32_System_Registry"] }

[dev-dependencies]
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
