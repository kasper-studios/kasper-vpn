[package]
name = "kasper-vpn"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "signal", "time"] }
